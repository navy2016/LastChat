name: Build Debug APK

on:
  push:
    branches: [ exp-skills ]
  pull_request:
    branches: [ exp-skills ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare keystore (可选，如果需要签名)
        if: env.KEY_BASE64 != ''
        run: |
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key || true

      - name: Prepare signing config (可选)
        if: env.SIGNING_CONFIG != ''
        run: |
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties || true

      - name: Gradle Build Debug
        run: |
          chmod +x gradlew
          echo "Building debug APK..."
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload build output (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: List generated APKs
        run: |
          echo "=== Generated APKs ==="
          ls -lh app/build/outputs/apk/debug/
