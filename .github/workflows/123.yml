name: Android Plus Build (No Google/Keys)

on:
  push:
    tags:
      - "*plus*"  # 仅针对 plus 相关标签触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: 36
          accept-android-licenses: true

      - name: Build plus flavor (no Google/keys)
        run: |
          chmod +x gradlew
          # 清理缓存并构建 plus 版本的 release 包（禁用签名和 Google 服务相关任务）
          ./gradlew clean :app:assemblePlusRelease \
            -Pandroid.injected.signing.store.file=/dev/null \
            --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plus-release-apk
          path: app/build/outputs/apk/plus/release/*.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Plus Release ${{ github.ref_name }}
          files: app/build/outputs/apk/plus/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

