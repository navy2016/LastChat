name: Android Release Build

on:
  push:
    tags:
      - "*zh*"
      - "*plus*"
      - "[0-9]*"

permissions:
  contents: write     

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set flavor to plus
        id: flavor
        run: |
          echo "flavor=plus" >> "$GITHUB_OUTPUT"
          echo "Building for flavor: plus"

      - name: Create dummy keystore
        run: |
          # 创建虚拟签名密钥（测试用）
          keytool -genkeypair -v -keystore app/app.key -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=CI" \
            -storepass android -keypass android
          echo "Created dummy keystore"

      - name: Create local.properties
        run: |
          # 创建签名配置
          cat > local.properties <<EOF
          storeFile=app.key
          storePassword=android
          keyAlias=key0
          keyPassword=android
          EOF
          echo "Created local.properties"

      - name: Gradle Build Release
        run: |
          set -euo pipefail
          chmod +x gradlew
          
          echo "Building release APK (assemblePlusRelease)..."
          ./gradlew ":app:assemblePlusRelease" --no-daemon --stacktrace

      - name: Upload build output (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-plus
          path: app/build/outputs/apk/plus/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/plus/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
