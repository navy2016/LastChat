name: Build Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 🔥 直接创建占位文件，无需secret
      - name: Create Placeholder google-services.json
        run: |
          mkdir -p app/src/plus
          cat > app/src/plus/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "lastchat-rikkafork-cocolal-plus",
              "storage_bucket": "lastchat-rikkafork-cocolal-plus.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:abcdef123456",
                "android_client_info": {
                  "package_name": "lastchat.rikkafork.cocolal.plus"
                }
              },
              "api_key": [{"current_key": "dummy-key-for-self-use-only"}]
            }]
          }
          EOF

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assemblePlusDebug --parallel --build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lastchat-plus-debug
          path: app/build/outputs/apk/plus/debug/*.apk
          retention-days: 30

      # 可选：Release时自动上传
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/plus/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

